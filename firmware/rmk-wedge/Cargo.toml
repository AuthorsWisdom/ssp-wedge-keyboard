[package]
name = "ssp-wedge-kb"
version = "0.1.0"
authors = ["Seven Swords Productions"]
description = "RMK firmware for the Seven Swords Wedge keyboard (RP2040, 4x12 + encoder)"
edition = "2024"
license = "MIT"

[[bin]]
name = "ssp-wedge-kb"
test = false
bench = false

[dependencies]
rmk = { version = "=0.9.0", default-features = false, features = ["defmt", "storage", "vial", "watchdog", "rp2040"] }
embassy-time = { version = "0.5", features = ["defmt"] }
embassy-rp = { version = "0.10", features = ["rp2040", "defmt", "time-driver", "critical-section-impl"] }
embassy-executor = { version = "0.10", features = ["defmt", "platform-cortex-m", "executor-thread"] }
cortex-m-rt = "0.7.5"
portable-atomic = { version = "1", features = ["critical-section"] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

[build-dependencies]
const-gen = "1.6"
json = "0.12"
xz2 = "0.1.7"

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = "unwind"

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"
